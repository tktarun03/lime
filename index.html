<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0C0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LIME">
<meta name="author" content="Arunkumar Thamilarasu">
<meta name="description" content="LIME — a minimalist workout tracker. Your data stays on your phone.">
<title>LIME Workout</title>
<link rel="manifest" href="manifest.webmanifest?v=0.8.0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icons/favicon-64.png?v=0.8.0" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=0.8.0">
<link rel="preload" href="fonts/oswald-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css?v=0.8.0">
</head>
<body>
  <!-- Splash: removed by app.js; a CSS fallback hides it after 4 s so it can never get stuck -->
  <div id="splash" class="splash" aria-hidden="true">
    <img class="splash-logo" src="icons/icon-192.png?v=0.8.0" alt="" width="96" height="96">
    <div class="splash-mark">LIME</div>
    <div class="splash-by">by Arunkumar Thamilarasu</div>
  </div>

  <main id="view" class="view" tabindex="-1"></main>

  <nav id="tabbar" class="tabbar" aria-label="Main" hidden>
    <a href="#/home" data-tab="home"><span class="ico" data-icon="home"></span><span>Home</span></a>
    <a href="#/library" data-tab="library"><span class="ico" data-icon="library"></span><span>Moves</span></a>
    <a href="#/progress" data-tab="progress"><span class="ico" data-icon="chart"></span><span>Progress</span></a>
    <a href="#/settings" data-tab="settings"><span class="ico" data-icon="gear"></span><span>Settings</span></a>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast-root"></div>

  <!-- Load order matters: core → data → ui → features → app. Tested in tests/structure.test.mjs -->
  <script src="js/core/version.js?v=0.8.0"></script>
  <script src="js/core/util.js?v=0.8.0"></script>
  <script src="js/core/store.js?v=0.8.0"></script>
  <script src="js/core/timer.js?v=0.8.0"></script>
  <script src="js/core/audio.js?v=0.8.0"></script>
  <script src="js/data/exercises.js?v=0.8.0"></script>
  <script src="js/data/art.js?v=0.8.0"></script>
  <script src="js/data/brand.js?v=0.8.0"></script>
  <script src="js/data/figures.js?v=0.8.0"></script>
  <script src="js/data/planner.js?v=0.8.0"></script>
  <script src="js/ui/icons.js?v=0.8.0"></script>
  <script src="js/ui/toast.js?v=0.8.0"></script>
  <script src="js/ui/sheet.js?v=0.8.0"></script>
  <script src="js/ui/charts.js?v=0.8.0"></script>
  <script src="js/ui/body3d.js?v=0.8.0"></script>
  <script src="js/features/stats.js?v=0.8.0"></script>
  <script src="js/features/onboarding.js?v=0.8.0"></script>
  <script src="js/features/home.js?v=0.8.0"></script>
  <script src="js/features/library.js?v=0.8.0"></script>
  <script src="js/features/player.js?v=0.8.0"></script>
  <script src="js/features/plan.js?v=0.8.0"></script>
  <script src="js/features/about.js?v=0.8.0"></script>
  <script src="js/features/progress.js?v=0.8.0"></script>
  <script src="js/features/settings.js?v=0.8.0"></script>
  <script src="js/app.js?v=0.8.0"></script>
</body>
</html>
